name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The tests stub out Whisper, EasyOCR, sentence-transformers and Gemini,
      # so CI skips the multi-GB model packages and installs only what the
      # code under test imports.
      - name: Install test dependencies
        run: >
          pip install fastapi pydantic python-multipart python-dotenv
          numpy faiss-cpu neo4j PyMuPDF opencv-python-headless pytest httpx
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
